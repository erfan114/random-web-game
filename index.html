<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGame</title>
  </head>
  <body
    style="
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      height: 100vh;
    "
  >
    <span style="position: fixed; left: 10px; top: 10px; color: white">
      FPS: <span id="my-fps">-</span>
    </span>
    <span style="position: fixed; left: 10px; top: 30px; color: white">
      Score: <span id="my-score">0</span>
    </span>
    <span style="position: fixed; left: 10px; top: 70px; color: white">
      Move: A/W/S/D
    </span>
    <span
      id="bar"
      style="
        position: fixed;
        left: 0px;
        bottom: 0px;
        height: 10px;
        background-color: white;
      "
    >
    </span>
    <canvas id="my-game" width="500" height="500"></canvas>
    <script src="./index.js"></script>
  </body>
</html>
