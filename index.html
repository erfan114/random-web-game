<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My random game</title>
  </head>
  <body
    style="
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      height: 100vh;
    "
  >
    <span style="position: fixed; left: 10px; top: 10px; color: white">
      FPS: <span id="my-fps">-</span>
    </span>
    <span style="position: fixed; left: 10px; top: 30px; color: white">
      Score: <span id="my-score">0</span>
    </span>
    <span style="position: fixed; left: 10px; top: 70px; color: white">
      Move: A/W/S/D
    </span>
    <span style="position: fixed; left: 10px; top: 90px; color: white">
      Pause: ESC
    </span>
    <span style="position: fixed; left: 10px; top: 110px; color: white">
      Restart: R
    </span>

    <span
      id="bar"
      style="
        position: fixed;
        left: 0px;
        bottom: 0px;
        height: 10px;
        background-color: white;
        transition: all 100ms linear;
      "
    >
    </span>
    <div
      id="pause"
      style="
        background-color: rgba(0, 0, 0, 0.8);
        position: fixed;
        inset: 0;
        color: white;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      "
    >
      <h1>Game Paused</h1>
      <p>Press ESC to continue</p>
    </div>
    <canvas id="my-game" width="500" height="500"></canvas>

    <script src="./index.js"></script>
